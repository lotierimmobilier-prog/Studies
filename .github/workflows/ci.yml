name: Intégration continue

# Vérifie chaque pull request avant la fusion, et chaque push sur main.
# Les deux autres workflows (deploy-pages, deploy-vps) restent manuels : celui-ci
# ne déploie rien, il ne fait que contrôler.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Tests, build et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Build du front (inclut le typage)
        run: npm run build
      - name: Typage du serveur
        run: npm run typecheck:server
      - name: Typage des paquets kitetudiant
        run: npm run typecheck:kitetudiant
      - name: Build du front KITETUDIANT
        run: npm run build:kitetudiant

  scripts-python:
    name: Scripts d'exploration Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôle de syntaxe
        run: python -m compileall -q kitetudiant/scripts kitetudiant/packages

  schema-sql:
    name: Schéma PostgreSQL + PostGIS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le schéma sur une base neuve
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: kitetudiant/db/valider_schema.sh
      - name: Vérifier que les contraintes rejettent ce qu'elles doivent rejeter
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
          LC_ALL: C
        run: |
          rejets=$(psql "$PGURL" -f kitetudiant/db/tests_contraintes.sql 2>&1 \
            | grep -c 'violates check constraint' || true)
          echo "$rejets contraintes ont rejeté l'insertion interdite"
          test "$rejets" -eq 9
