name: Déployer le front sur GitHub Pages

# Déploie le front React sur GitHub Pages (aperçu visuel uniquement).
# - manuellement via « Run workflow ».
#
# Prérequis (une seule fois) : Settings → Pages → Source = « GitHub Actions ».
#
# ⚠️ Le portail a besoin de son serveur Node (authentification + séjours) pour
# fonctionner. GitHub Pages ne sert que le front statique : la connexion ne
# marchera donc PAS ici. Pour un site pleinement fonctionnel, déployez sur le
# VPS via deploy/vps-setup.sh (voir deploy/README.md).

# Déclenchement manuel uniquement (le déploiement principal se fait sur le VPS
# via deploy-vps.yml). Active « GitHub Actions » dans Settings → Pages avant de
# lancer ce workflow depuis l'onglet Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Chemins relatifs pour fonctionner sous le sous-dossier GitHub Pages.
          VITE_BASE: './'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
