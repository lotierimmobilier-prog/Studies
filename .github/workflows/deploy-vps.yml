name: Déployer sur le VPS

# Synchronisation vers le VPS (manuelle). Envoie le front (statique) ET le
# serveur Node (authentification + séjours), puis redémarre l'API.
#
# Prérequis (voir deploy/README.md) :
#  - Secrets du dépôt : VPS_HOST, VPS_USER, VPS_SSH_KEY
#    (+ facultatif : SESSION_SECRET pour la signature des jetons de session)
#  - Sur le VPS : Node 22, nginx, pm2, et les dossiers cibles créés.
#
# NB : le déploiement RECOMMANDÉ se fait directement sur le VPS via
# deploy/vps-setup.sh (aucune clé SSH GitHub requise, multi-projets sous
# sous-chemin). Ce workflow-ci sert le site à la racine du domaine.

# Déclenchement MANUEL uniquement (Actions → « Déployer sur le VPS » → Run
# workflow).
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  WEB_ROOT: /var/www/maisoncapendu        # racine servie par nginx (front statique)
  APP_DIR: /opt/maisoncapendu             # dossier du serveur Node sur le VPS

jobs:
  deploy:
    runs-on: ubuntu-latest
    # VPS_HOST est exposé pour permettre aux étapes de déploiement de se
    # « mettre en pause » proprement tant que les secrets ne sont pas définis
    # (le job reste vert au lieu d'échouer).
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer et builder le front
        run: |
          npm ci
          npm run build          # VITE_BASE par défaut = '/', servi à la racine du domaine

      - name: Secrets non configurés — déploiement ignoré
        if: ${{ env.VPS_HOST == '' }}
        run: echo "::notice::Secrets VPS absents (VPS_HOST/VPS_USER/VPS_SSH_KEY). Voir deploy/README.md. Déploiement ignoré."

      - name: Charger la clé SSH
        if: ${{ env.VPS_HOST != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux hôtes connus
        if: ${{ env.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Synchroniser le front (dist → nginx)
        if: ${{ env.VPS_HOST != '' }}
        run: |
          rsync -az --delete dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${WEB_ROOT}/"

      - name: Synchroniser le serveur Node
        if: ${{ env.VPS_HOST != '' }}
        run: |
          rsync -az --delete \
            server/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/server/"
          rsync -az package.json package-lock.json tsconfig.server.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/"

      - name: Installer les dépendances et (re)démarrer l'API
        if: ${{ env.VPS_HOST != '' }}
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "SESSION_SECRET='${SESSION_SECRET}' ADMIN_PASSWORD='${ADMIN_PASSWORD}' bash -s" <<'REMOTE'
          set -e
          cd /opt/maisoncapendu
          npm ci
          : > .env
          # Secret de session : celui fourni, sinon un déjà généré, sinon nouveau.
          if [ -z "$SESSION_SECRET" ] && [ -f .session_secret ]; then
            SESSION_SECRET="$(cat .session_secret)"
          fi
          if [ -z "$SESSION_SECRET" ]; then
            SESSION_SECRET="$(head -c 32 /dev/urandom | base64)"
          fi
          printf '%s' "$SESSION_SECRET" > .session_secret
          chmod 600 .session_secret
          echo "SESSION_SECRET=$SESSION_SECRET" >> .env
          # Mot de passe admin : celui fourni, sinon un déjà défini, sinon « admin ».
          if [ -z "$ADMIN_PASSWORD" ] && [ -f .admin_password ]; then
            ADMIN_PASSWORD="$(cat .admin_password)"
          fi
          [ -z "$ADMIN_PASSWORD" ] && ADMIN_PASSWORD="admin"
          printf '%s' "$ADMIN_PASSWORD" > .admin_password
          chmod 600 .admin_password
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
          # (Re)démarre l'API via pm2 (tsx exécute le TypeScript directement).
          if pm2 describe maisoncapendu-api > /dev/null 2>&1; then
            env PORT=8788 SESSION_SECRET="$SESSION_SECRET" ADMIN_PASSWORD="$ADMIN_PASSWORD" pm2 restart maisoncapendu-api --update-env
          else
            env PORT=8788 SESSION_SECRET="$SESSION_SECRET" ADMIN_PASSWORD="$ADMIN_PASSWORD" pm2 start "npx tsx server/index.ts" --name maisoncapendu-api --update-env
          fi
          pm2 save
          REMOTE
