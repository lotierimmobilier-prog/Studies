<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- « %BASE_URL% » et non un chemin relatif : depuis une adresse profonde
         comme /kitetudiant/blog/<slug>, « favicon.svg » serait cherchée dans
         /blog/ et renverrait 404. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>KitEtudiant.fr — administration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
